name: Check Jenkins User System

on:
  workflow_dispatch:
    inputs:
      username_to_check:
        description: 'Имя пользователя для проверки в /etc/passwd'
        required: true
        default: 'root'

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Job and Get Result
        run: |
          JENKINS_URL="http://${{ secrets.JENKINS_HOST }}"
          JOB_NAME="check-system-user"
          USER_PARAM="${{ github.event.inputs.username_to_check }}"
          
          echo "🚀 Шаг 1: Отправка JSON-вебхука в Jenkins для пользователя: $USER_PARAM"
          
          # Отправляем POST-запрос на специальный эндпоинт плагина Generic Webhook Trigger.
          HTTP_CODE=$(curl -X POST -s -L \
            -H "Content-Type: application/json" \
            -H "Host: jenkins.k8s-1.sa" \
            -o /dev/null -w "%{http_code}" \
            -d "{\"username\": \"$USER_PARAM\"}" \
            "$JENKINS_URL/generic-webhook-trigger/invoke?token=my-super-secret-token")
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Ошибка: Не удалось вызвать вебхук. HTTP Код ответа: $HTTP_CODE"
            exit 1
          fi
          
          echo "⏳ Вебхук успешно принят. Ожидаем 12 секунд для инициализации и старта билда..."
          sleep 12
          
          # Кодируем креды в Base64 для безопасного чтения API
          AUTH_BASE64=$(echo -n "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" | base64)
          
          # 2. Получаем URL самого последнего билда этой задачи (ДОБАВЛЕНЫ ЗАГОЛОВКИ И -L)
          BUILD_URL=$(curl -s -L \
            -H "Authorization: Basic $AUTH_BASE64" \
            -H "Host: jenkins.k8s-1.sa" \
            "$JENKINS_URL/job/$JOB_NAME/api/json" | jq -r '.lastBuild.url // empty')
          
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "❌ Не удалось определить URL запущенного билда через API проекта."
            exit 1
          fi
          
          # Если Jenkins внутри k8s сгенерировал ссылку с внутренним доменом http://k8s-1.sa,
          # подменяем её на внешний адрес ngrok, чтобы GitHub Actions смог продолжить опрос
          if [[ "$BUILD_URL" == *"jenkins.k8s-1.sa"* ]]; then
            BUILD_URL="${BUILD_URL/http:\/\/jenkins.k8s-1.sa/$JENKINS_URL}"
          fi
          
          echo "🏃 Сборка стартовала: $BUILD_URL"
          
          # 3. Опрашиваем статус выполнения билда, передавая Host-header для прохода через Ingress
          IS_BUILDING="true"
          while [ "$IS_BUILDING" = "true" ]; do
            echo "Сборка выполняется, ждем..."
            sleep 4
            IS_BUILDING=$(curl -s -L \
              -H "Authorization: Basic $AUTH_BASE64" \
              -H "Host: jenkins.k8s-1.sa" \
              "${BUILD_URL}api/json" | jq -r '.building')
          done
          
          echo "✅ Сборка в Jenkins успешно завершена!"
          
          # 4. Читаем лог сборки обратно с использованием Host-header
          echo "=== ФИНАЛЬНЫЙ ВЕРДИКТ ИЗ JENKINS ==="
          curl -s -L \
            -H "Authorization: Basic $AUTH_BASE64" \
            -H "Host: jenkins.k8s-1.sa" \
            "${BUILD_URL}logText/progressiveText?start=0" | grep "RESULT:" || echo "Строка результата не найдена в логах."
          echo "====================================="
